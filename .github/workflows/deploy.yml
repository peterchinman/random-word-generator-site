name: Deploy to DigitalOcean

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and test
        run: |
          npm ci
          npm run build
          npm test
          npm run test:build
      
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
      
      - name: Add DigitalOcean to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to DigitalOcean
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DEPLOY_PATH: /var/www/randomwordgenerator.info
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download
        run: |
          # Astro emits HTML and hashed CSS/JS into dist, including the PHP API.
          # Keep the dictionary and existing web-root symlink until the build is
          # uploaded and the post-deployment tasks below finish.
          rsync -avz --delete \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude=".astro" \
            --exclude="public_html" \
            --exclude="database/build" \
            --exclude="database/.venv" \
            --exclude="database/dictionary.db" \
            --exclude="database/dictionary.db.release" \
            ./ root@$DROPLET_IP:$DEPLOY_PATH

          # Post-deployment tasks on the server. The script is sent on stdin, unexpanded
          # (quoted heredoc), with the values it needs passed as environment variables.
          ssh root@$DROPLET_IP "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_URL='$RELEASE_URL' bash -s" <<'REMOTE'
            set -e
            cd "$DEPLOY_PATH"

            # Fetch the dictionary named in database/RELEASE, unless that release is
            # already on the server (its tag is remembered in dictionary.db.release).
            TAG=$(cat database/RELEASE)
            if [ "$(cat database/dictionary.db.release 2>/dev/null)" != "$TAG" ]; then
              echo "Downloading dictionary.db from release $TAG"
              curl -fsSL --retry 3 -o database/dictionary.db.download "$RELEASE_URL/$TAG/dictionary.db"
              mv database/dictionary.db.download database/dictionary.db
              echo "$TAG" > database/dictionary.db.release
            fi

            # Remove existing public_html if it's not a symlink
            if [ -d public_html ] && [ ! -L public_html ]; then
              rm -rf public_html
            fi

            # Serve Astro's generated pages and the copied PHP API together.
            ln -sfn "$DEPLOY_PATH/dist" public_html

            # Set permissions and reload the server
            chown -R www-data:www-data "$DEPLOY_PATH"
            chmod -R 755 "$DEPLOY_PATH"
            systemctl reload apache2
          REMOTE
