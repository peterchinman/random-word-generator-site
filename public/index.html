<!DOCTYPE html>
<html lang="en">
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Random Word Generator</title>

	<meta name="description" content="Find fate in the stochastic.">
	<meta property="og:image" content="https://randomwordgenerator.info/assets/images/sharecard.png">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100..700&display=swap" rel="stylesheet">

	<!-- ?v=dev is replaced with the commit hash at deploy time so caches pick up new files -->
	<link href="assets/css/reset.css?v=dev" rel="stylesheet">
	<link href="assets/css/setup.css?v=dev" rel="stylesheet">
	<link href="assets/css/style.css?v=dev" rel="stylesheet">

</head>

<body class="pink light">
<script>
	// Apply the remembered palette and the system colour scheme before anything is painted,
	// so returning visitors don't see the default theme flash. javascript.js repeats this.
	document.body.classList.toggle('blue', localStorage.getItem('palette') === 'blue');
	document.body.classList.toggle('pink', localStorage.getItem('palette') !== 'blue');
	if (matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.replace('light', 'dark');
</script>

<header>
	<inner-column>
		<h1 class="title">Random <span class="title-word-cursor-container"><span id="title-word">Word</span><span class="cursor"></span><span id="title-spaces"></span></span> Generator</h1>
	</inner-column>
</header>

<main>
	<form id="word-options">
		<inner-column>
			<fieldset class="options">
				<legend>Number of words to generate</legend>
				<label>10<input type="radio" name="number-words" value="10"></label>
				<label>15<input type="radio" name="number-words" value="15"></label>
				<label>25<input type="radio" name="number-words" value="25" checked></label>
				<label>40<input type="radio" name="number-words" value="40"></label>
			</fieldset>
			<details id="filters">
				<summary>
					Filters
					<svg class="option-arrow-svg" width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
						<path d="M1.5 1.21094L7.5 4.99993L1.5 8.78892" stroke="black" stroke-width="2" stroke-linecap="round"/>
					</svg>
				</summary>
				<fieldset class="options">
					<legend>Parts of Speech</legend>
					<label>noun<input type="checkbox" name="parts-of-speech" value="noun"></label>
					<label>verb<input type="checkbox" name="parts-of-speech" value="verb"></label>
					<label>adj<input type="checkbox" name="parts-of-speech" value="adjective"></label>
					<label>adv<input type="checkbox" name="parts-of-speech" value="adverb"></label>
				</fieldset>
				<fieldset class="range" id="rareness">
					<legend>Rareness</legend>
					<!-- Two range inputs on one track make the two thumbs; javascript.js keeps the filled
					     stretch of track, the tick marks and the readout in step with them. -->
					<div class="slider">
						<div class="track"></div>
						<input type="range" name="tier-a" min="0" max="6" value="0" aria-label="Rareness, first handle">
						<input type="range" name="tier-b" min="0" max="6" value="3" aria-label="Rareness, second handle">
					</div>
					<div class="readout">
						<p class="from"><span class="preposition">from</span> <span class="tier-name"></span> <span class="examples"></span></p>
						<p class="to"><span class="preposition">to</span> <span class="tier-name"></span> <span class="examples"></span></p>
					</div>
					<!-- The tiers from least to most rare: API code, name shown on the site, three example words -->
					<datalist id="tiers">
						<option value="common" label="everyday" data-examples="lake, crane, peppermint"></option>
						<option value="uncommon" label="familiar" data-examples="rancid, valise, surfeit"></option>
						<option value="scarce" label="unusual" data-examples="balalaika, buckram, fogbound"></option>
						<option value="rare" label="rare" data-examples="ceilingward, foxskin, stonecraft"></option>
						<option value="obscure" label="obscure" data-examples="trumpetry, heliophobe, lampadomancy"></option>
						<option value="marginal" label="fringe" data-examples="moanless, clamjamfrey, shriekery"></option>
						<option value="unattested" label="dubious" data-examples="orckind, noctivagator, claymorphism"></option>
					</datalist>
				</fieldset>
				<fieldset class="min-max">
					<legend>Word Length</legend>
					<div class="number-input">
						<button type="button" class="decrement crement" aria-label="Decrease minimum word length">
							<svg class="decrement-svg" width="18" height="15" viewBox="0 0 18 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
								<path d="M17 1L9 13L1 0.999999" stroke="black" stroke-width="2" stroke-linecap="round"/>
							</svg>
						</button>
						<label><span>min</span>
							<input type="number" min="1" max="45" name="min-word-length">
						</label>
						<button type="button" class="increment crement" aria-label="Increase minimum word length">
							<svg class="increment-svg" width="18" height="15" viewBox="0 0 18 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
								<path d="M1 14L9 2L17 14" stroke="black" stroke-width="2" stroke-linecap="round"/>
							</svg>
						</button>
					</div>
					<div class="number-input">
						<button type="button" class="decrement crement" aria-label="Decrease maximum word length">
							<svg class="decrement-svg" width="18" height="15" viewBox="0 0 18 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
								<path d="M17 1L9 13L1 0.999999" stroke="black" stroke-width="2" stroke-linecap="round"/>
							</svg>
						</button>
						<label><span>max</span>
							<input type="number" min="1" max="45" name="max-word-length">
						</label>
						<button type="button" class="increment crement" aria-label="Increase maximum word length">
							<svg class="increment-svg" width="18" height="15" viewBox="0 0 18 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
								<path d="M1 14L9 2L17 14" stroke="black" stroke-width="2" stroke-linecap="round"/>
							</svg>
						</button>
					</div>
				</fieldset>
				<!-- Options stays collapsed until opened; data-examples is shown in a bubble when a pill is hovered or focused -->
				<details id="options">
					<summary>
						Options
						<svg class="option-arrow-svg" width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
							<path d="M1.5 1.21094L7.5 4.99993L1.5 8.78892" stroke="black" stroke-width="2" stroke-linecap="round"/>
						</svg>
					</summary>
					<fieldset class="options columns-2">
						<label data-examples="ice cream, black hole, red tape">multi-word<input type="checkbox" name="include" value="multiword"></label>
						<label data-examples="made-up, two-bit, tuk-tuk">hyphenated<input type="checkbox" name="include" value="hyphenated" checked></label>
						<label data-examples="o'clock, ma'am, y'all">apostrophe<input type="checkbox" name="include" value="apostrophe" checked></label>
						<label data-examples="Orkney, Bugatti, Kafkaesque">capitalized<input type="checkbox" name="include" value="capitalized"></label>
						<label data-examples="puissant, glaive, avaunt">archaic<input type="checkbox" name="include" value="archaic" checked></label>
						<label data-examples="serotonin, feldspar, enthalpy">technical<input type="checkbox" name="include" value="technical" checked></label>
					</fieldset>
				</details>
			</details>
			<fieldset class="buttons">
				<button type="submit" id="generate">Generate</button>
				<button type="reset" id="reset">Reset</button>
			</fieldset>
		</inner-column>
	</form>

	<div id="results">
		<section class="word-sections empty" id="generated-words">
			<inner-column>
				<h2 class="attention-voice"><span id="number-of-words"></span> Random Words</h2>
				<word-list id="generated-words-list"></word-list>
				<p>click on a word for a definition</p>
			</inner-column>
		</section>
		<section class="word-sections empty" id="saved-words">
			<inner-column>
				<div class="upper-part">
					<h2 class="loud-voice">Saved Words</h2>
					<div class="tools">
						<button type="button" id="clear-saved-words">Clear</button>
						<button type="button" id="copy-saved-words">Copy</button>
					</div>
				</div>
				<word-list id="saved-words-list"></word-list>
			</inner-column>
		</section>
	</div>
</main>

<div class="theme-toggles">
	<div class="theme-toggle">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c4 3-4 6 0 9s-4 6 0 9"/></svg>
		<label class="switch-container">
			<input type="checkbox" id="pink-blue" aria-label="Cool palette">
			<div class="slider"></div>
		</label>
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg>
	</div>
	<div class="theme-toggle">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
		<label class="switch-container">
			<input type="checkbox" id="light-dark" aria-label="Dark mode">
			<div class="slider"></div>
		</label>
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
	</div>
</div>

<footer>
	<inner-column>
		<p><a href="https://github.com/peterchinman/random-word-generator-site">This site</a> was made by <a href="https://peterchinman.com">Peter Chinman</a>.</p>
	</inner-column>
</footer>

<script src="assets/javascript/javascript.js?v=dev"></script>

</body>
</html>
